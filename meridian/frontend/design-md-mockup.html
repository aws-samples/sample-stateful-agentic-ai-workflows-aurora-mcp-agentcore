    <!--
      IMPECCABLE DIRECTION CONTRACT
      Mode: Operate with an image-led discovery state.
      World: Meridian's existing midnight navy, Geist typography, blue action,
      green verification, and amber disruption language.
      First viewport: The product is already working. Discovery opens as one
      cinematic recommendation with two supporting options; Recovery opens as
      one dominant protected plan with alternatives, concierge, proof, and
      checkpoint state.
      Signature interaction: Discovery and Recovery exchange visual priority
      without changing product chrome; selection remains explicit in both.
      Responsive rule: Preserve the decision order on narrow screens and let
      imagery become taller rather than shrinking text or controls.
      Risk: Cinematic imagery must never obscure decision copy, and recovery
      must remain evidence-led rather than becoming another travel gallery.
    -->
