[pytest]
# Pytest configuration for Meridian Enhancement

# Test discovery
testpaths = tests examples/langgraph/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async tests (pytest-asyncio)
asyncio_mode = auto

# Upstream, not this repo's settings: mcp 1.29's FastMCP Settings annotates its
# `lifespan` field with a forward reference to FastMCP, and pydantic-settings
# 2.15 warns about it each time FastMCP(...) builds its settings.
filterwarnings =
    ignore:Field 'lifespan' has an incomplete:pydantic_settings.IncompleteFieldDefinitionWarning

# Output settings
addopts = -v --tb=short

# Markers
markers =
    property: Property-based tests using Hypothesis
    database: Tests requiring database connection
    slow: Tests that take longer to run

# Logging
log_cli = true
log_cli_level = INFO
