[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "MeridianWorkflow"
version = "0.1.0"
description = "AgentCore Runtime Application running the Meridian Phase 5 workflow"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aws-opentelemetry-distro==0.21.0",
    "bedrock-agentcore==1.24.0",
    "boto3==1.43.107",
    "botocore[crt]==1.43.107",
    "pydantic==2.13.4",
    "strands-agents==1.57.2",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
# The AgentCore CLI runs `uv pip install -r pyproject.toml`, which ignores uv.lock but
# honors these, so every package a deploy installs is fixed. Regenerate with:
#   uv pip compile pyproject.toml --python-version 3.14 \
#     --python-platform aarch64-manylinux2014 --only-binary :all:
# Every strands-agents release so far (through 1.62.0) declares mcp<2.2, and mcp patches
# only the newest release of each line, so 2.x below 2.2 keeps the advisories 2.2.0 fixed
# (CVE-2026-59951 and GHSA-5h93-6whr-6q8j, GHSA-rwrf-2pqf-9j8j, GHSA-qx49-fqc8-xw99).
# Override that bound until strands-agents/harness-sdk#5264 (mcp<2.4) is released.
# aws-opentelemetry-distro 0.21.0 (the newest) pins every OpenTelemetry package to 1.44.0 / 0.65b0,
# which carries CVE-2026-114603; override those pins to the fixed 1.45.1 / 0.66b1 line.
override-dependencies = [
    "mcp==2.3.0",
    "opentelemetry-api==1.45.1",
    "opentelemetry-distro==0.66b1",
    "opentelemetry-exporter-otlp-proto-common==1.45.1",
    "opentelemetry-exporter-otlp-proto-grpc==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
