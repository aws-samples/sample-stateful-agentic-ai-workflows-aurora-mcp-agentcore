[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "MeridianWorkflow"
version = "0.1.0"
description = "AgentCore Runtime Application running the Meridian Phase 5 workflow"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aws-opentelemetry-distro==0.21.0",
    "bedrock-agentcore==1.24.0",
    "boto3==1.43.107",
    "botocore[crt]==1.43.107",
    "pydantic==2.13.4",
    "strands-agents==1.57.2",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
# The AgentCore CLI runs `uv pip install -r pyproject.toml`, which ignores uv.lock but
# honors these, so every package a deploy installs is fixed. Regenerate with:
#   uv pip compile pyproject.toml --python-version 3.14 \
#     --python-platform aarch64-manylinux2014 --only-binary :all:
constraint-dependencies = [
