name: Application CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meridian
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: meridian/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pip-audit
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python -m pytest
      - run: python -m pip_audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meridian/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: meridian/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
      - run: npm audit --audit-level=high

  agentcore-cdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meridian/meridian_agentcore/agentcore/cdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: meridian/meridian_agentcore/agentcore/cdk/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v5
      - run: npm ci
      - run: npm run build
      - run: npm test -- --runInBand
      - run: npm run format:check
