name: Application CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Every version here is exact. Python and Node come from meridian/.python-version and
# meridian/.nvmrc; actions are pinned to a release commit. meridian/tests/test_version_pins.py
# fails when a pin is missing or drifts.

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: meridian
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: meridian/.python-version
          cache: pip
          cache-dependency-path: meridian/requirements*.txt
      - run: python -m pip install pip==26.2.1
      - run: python -m pip install --require-hashes -r requirements-ci.txt
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python -m pip install --require-hashes --no-deps -r requirements-runtime-tests.txt
      - run: python -m pip install --require-hashes -r examples/langgraph/requirements.txt
      - run: ruff check backend scripts tests examples meridian_agentcore/app meridian_agentcore/agentcore/gateway_targets meridian_agentcore/agentcore/interceptors infra/functions
      # Live Aurora checks require a separately configured test cluster.
      - run: python -m pytest -m "not database" tests examples/langgraph/tests
      - run: python -m pip_audit -r requirements.txt
      - run: python -m pip_audit -r requirements.txt -r requirements-runtime-tests.txt
      - run: python -m pip_audit -r examples/langgraph/requirements.txt
      - run: python -m pip_audit -r requirements-ci.txt
      - run: python scripts/audit_runtime_dependencies.py

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: meridian/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: meridian/.nvmrc
          cache: npm
          cache-dependency-path: meridian/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:accessibility

  backend-container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the production backend and locked MCP server
        run: docker build --tag meridian-ci ./meridian
      - name: Load MCP from the final non-root image without network access
        run: >-
          docker run --rm --network none --entrypoint python meridian-ci
          -m awslabs.postgres_mcp_server.server --help
      - name: The image runs the pinned Python
        run: >-
          test "$(docker run --rm --network none --entrypoint python meridian-ci -c
          'import platform; print(platform.python_version())')" = "$(cat meridian/.python-version)"

  agentcore-cdk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: meridian/meridian_agentcore/agentcore/cdk
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: meridian/.nvmrc
          cache: npm
          cache-dependency-path: meridian/meridian_agentcore/agentcore/cdk/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: meridian/.python-version
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: '0.13.6'
      - run: npm ci
      - run: npm run build
      - run: npm test -- --runInBand
      - run: npm run format:check
      # Fails on any high or critical finding except one documented exception; see the script.
      - run: npm audit --audit-level=high

  web-infra:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: meridian/infra
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: meridian/.nvmrc
          cache: npm
          cache-dependency-path: meridian/infra/package-lock.json
      - run: npm ci
      - run: npm test
      # Fails on any high or critical finding except one documented exception; see the script.
      - run: npm audit --audit-level=high
